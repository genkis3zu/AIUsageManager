<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>AI Usage Manager</title>
  <style>
    body { margin: 0; padding: 8px 12px; background: #2d2d2d; color: #d8d8d8; font-family: 'Segoe UI', 'Yu Gothic UI', 'Meiryo', sans-serif; font-size: 9pt; }
    .row { display: flex; align-items: center; margin: 6px 0; }
    .name { flex: none; width: 112px; color: #969696; }
    select, input[type=text] { flex: 1; min-width: 0; padding: 4px 6px; border: 0; border-radius: 3px; background: #3d3d3d; color: #d8d8d8; font: inherit; }
    .note { margin: 2px 0 8px 112px; color: #969696; font-size: 8pt; }
    .note.error { color: #f4a261; }
  </style>
</head>
<body>
  <div class="row"><label class="name" for="style">表示スタイル</label>
    <select id="style"><option value="ring">リング</option><option value="vertical">縦バー</option><option value="horizontal">横バー</option></select></div>
  <div class="row"><label class="name" for="metric">数値</label>
    <select id="metric"><option value="used">使用率</option><option value="remaining">残り</option></select></div>
  <div class="row"><label class="name" for="showReset">リセットまでの時間</label><input type="checkbox" id="showReset"></div>
  <div class="row"><label class="name" for="palette">色</label><select id="palette"></select></div>
  <div class="row"><label class="name" for="appPath">トレイアプリの場所</label><input type="text" id="appPath" spellcheck="false" placeholder="空欄なら自動"></div>
  <div class="note" id="appPathNote">全キー共通です。空欄のときは、トレイアプリが記録した場所を使います。</div>
  <script src="settings.js"></script>
</body>
</html>
